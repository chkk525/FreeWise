<div id="tags-list" class="flex flex-wrap gap-2 justify-center mb-3">
    {% if book.document_tags %}
    {% for tag in book.document_tags.split(',') %}
    {% set tag_name = tag.strip() %}
    <div class="inline-flex items-center px-3 py-1.5 bg-surface-2 border rounded-full text-sm text-text-1">
        <i data-lucide="tag" class="w-3 h-3 mr-1.5"></i>
        <span>{{ tag_name }}</span>
        <form
            hx-post="/library/ui/book/{{ book.id }}/remove-tag"
            hx-target="#document-tags-section"
            hx-swap="innerHTML"
            class="inline-flex items-center">
            <input type="hidden" name="tag" value="{{ tag_name }}">
            <button
                type="submit"
                class="ml-2 text-text-3 hover:text-error transition-colors"
                title="Remove tag">
                <i data-lucide="x" class="w-3 h-3"></i>
            </button>
        </form>
    </div>
    {% endfor %}
    {% endif %}
</div>
<div class="text-center">
    <form
        hx-post="/library/ui/book/{{ book.id }}/add-tag"
        hx-target="#document-tags-section"
        hx-swap="innerHTML"
        class="inline-flex items-center gap-2 px-3 py-2 bg-surface-1 border border-dashed rounded-full text-text-2 hover:border-text-1 transition-colors">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <input
            type="text"
            name="new_tag"
            placeholder="Add document tags"
            class="bg-transparent focus:outline-none text-sm text-text-1 placeholder:text-text-3"
            autocomplete="off">
        <button type="submit" class="text-xs font-medium text-text-1 hover:underline transition-colors">Add</button>
    </form>
</div>
