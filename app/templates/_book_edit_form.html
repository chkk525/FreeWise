<div id="book-header" class="text-center mb-8">
    <div class="w-full max-w-2xl mx-auto">
        <!-- Form Header with Edit Indicator -->
        <div class="bg-surface-2 border-b px-4 py-3 rounded-t-component flex justify-between items-center">
            <span class="text-sm font-medium text-text-1 flex items-center gap-2">
                <i data-lucide="pencil" class="w-4 h-4"></i>
                <span>Editing Book Metadata</span>
            </span>
            <div class="flex items-center gap-2">
                <button
                    type="button"
                    hx-get="/library/ui/book/{{ book.id }}/cancel-edit"
                    hx-target="#book-header"
                    hx-swap="outerHTML"
                    class="inline-flex items-center gap-1 px-3 py-1.5 bg-surface-1 hover:bg-surface-2 border text-text-1 rounded-pill transition-colors text-xs font-medium"
                    title="Cancel">
                    <i data-lucide="x" class="w-4 h-4"></i>
                    <span>Cancel</span>
                </button>
                <button
                    type="submit"
                    form="book-metadata-form"
                    class="inline-flex items-center gap-1 px-3 py-1.5 bg-accent text-text-1 border border-text-1 rounded-pill font-medium text-xs transition-colors"
                    title="Save">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span>Save</span>
                </button>
            </div>
        </div>

        <!-- Form Fields -->
        <div class="bg-surface-1 border rounded-b-component p-6 space-y-4">

            <!-- Cover Image Section -->
            <div class="border border-dashed rounded-component p-4">
                <div class="flex items-center justify-between mb-2">
                    <div class="text-xs font-semibold text-text-2">Cover Image</div>
                    {% if book.cover_image_source %}
                    <span class="inline-flex items-center px-2 py-0.5 text-xs font-medium bg-surface-2 text-text-2 rounded-full">
                        {{ book.cover_image_source }}
                    </span>
                    {% endif %}
                </div>
                <p class="text-xs text-text-3 mb-4">Choose one option: upload your own file or search Open Library.</p>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Manual Upload -->
                    <div class="border rounded-component p-4 bg-surface-2">
                        <div class="flex items-center gap-2 text-sm font-semibold text-text-1 mb-3">
                            <i data-lucide="upload" class="w-4 h-4"></i>
                            <span>Manual upload</span>
                        </div>
                        <form
                            hx-post="/library/ui/book/{{ book.id }}/cover/upload"
                            hx-target="#cover-section"
                            hx-swap="outerHTML"
                            hx-encoding="multipart/form-data"
                            hx-indicator="#cover-upload-indicator"
                            class="flex flex-col items-center gap-3">
                            <input
                                type="file"
                                name="cover_file"
                                accept="image/jpeg,image/png,image/webp"
                                class="block w-full text-sm text-text-3 file:mr-4 file:py-2 file:px-4 file:rounded-pill file:border file:border-text-1 file:text-sm file:font-semibold file:bg-accent file:text-text-1"
                                required>
                            <button
                                type="submit"
                                class="w-full px-4 py-2 bg-accent text-text-1 border border-text-1 text-sm font-medium rounded-pill transition-colors">
                                Upload cover
                            </button>
                        </form>
                        <div id="cover-upload-indicator" class="htmx-indicator mt-3">
                            <div class="h-2 w-full bg-surface-3 rounded-full overflow-hidden">
                                <div class="h-full bg-text-1 animate-pulse" style="width: 100%;"></div>
                            </div>
                            <div class="text-xs text-text-3 text-center mt-1">Uploading...</div>
                        </div>
                    </div>

                    <!-- Open Library Search -->
                    <div class="border rounded-component p-4 bg-surface-2">
                        <div class="flex items-center gap-2 text-sm font-semibold text-text-1 mb-3">
                            <i data-lucide="search" class="w-4 h-4"></i>
                            <span>Search Open Library</span>
                        </div>
                        <form
                            hx-post="/library/ui/book/{{ book.id }}/cover/search"
                            hx-target="#cover-search-results"
                            hx-swap="innerHTML"
                            class="flex flex-col items-center gap-3">
                            <input
                                type="text"
                                name="query"
                                value="{{ book.title }}"
                                placeholder="Search by title or author"
                                class="w-full px-3 py-2 border rounded-input bg-surface-1 text-text-1 text-sm focus:outline-none focus:border-text-1">
                            <button
                                type="submit"
                                class="w-full px-4 py-2 bg-surface-1 hover:bg-surface-2 border text-text-1 text-sm font-medium rounded-pill transition-colors">
                                Find covers
                            </button>
                        </form>
                    </div>
                </div>

                <div id="cover-search-results" class="mt-4"></div>

                <div id="cover-download-indicator" class="htmx-indicator mt-4">
                    <div class="h-2 w-full max-w-xs mx-auto bg-surface-3 rounded-full overflow-hidden">
                        <div class="h-full bg-text-1 animate-pulse" style="width: 100%;"></div>
                    </div>
                    <div class="text-xs text-text-3 text-center mt-1">Downloading cover...</div>
                </div>

                <form
                    hx-post="/library/ui/book/{{ book.id }}/cover/delete"
                    hx-target="#cover-section"
                    hx-swap="outerHTML"
                    class="flex items-center justify-center mt-3">
                    <button
                        type="submit"
                        class="px-4 py-2 bg-error hover:opacity-90 text-white text-sm font-medium rounded-pill transition-colors">
                        Remove cover
                    </button>
                </form>
            </div>

            <!-- Metadata Form -->
            <form id="book-metadata-form"
                hx-post="/library/ui/book/{{ book.id }}/edit"
                hx-target="#book-header"
                hx-swap="outerHTML"
                class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-text-2 mb-2">Book Title</label>
                    <textarea
                        name="title"
                        required
                        rows="1"
                        class="w-full px-4 py-2 border rounded-input bg-surface-1 text-text-1 placeholder:text-text-3 focus:outline-none focus:border-text-1 transition-all resize-none overflow-hidden"
                        oninput="this.style.height='auto'; this.style.height=this.scrollHeight+'px'">{{ book.title }}</textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-2 mb-2">Author</label>
                    <input
                        type="text"
                        name="author"
                        value="{{ book.author or '' }}"
                        class="w-full px-4 py-2 border rounded-input bg-surface-1 text-text-1 placeholder:text-text-3 focus:outline-none focus:border-text-1 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-2 mb-2">Review Frequency</label>
                    <div>
                        <div class="flex items-center gap-3">
                            <span class="text-xs text-text-3">Never</span>
                            <input
                                type="range"
                                name="review_weight"
                                min="0"
                                max="2"
                                step="0.1"
                                value="{{ book.review_weight if book.review_weight is not none else 1.0 }}"
                                class="flex-1"
                                style="accent-color: var(--text1);">
                            <span class="text-xs text-text-3">More</span>
                        </div>
                        <div class="text-center text-xs text-text-3 mt-1">Normally</div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    (function () {
        function resizeTitle(root) {
            const t = (root && root.querySelector) ? root.querySelector('textarea[name="title"]') : document.querySelector('textarea[name="title"]');
            if (t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
        }
        resizeTitle(document);
        if (window.htmx && window.htmx.onLoad) { window.htmx.onLoad(resizeTitle); }
        if (typeof lucide !== 'undefined') { lucide.createIcons(); }
    })();
</script>
